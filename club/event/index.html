<!DOCTYPE html>
<html>
<head>
  <title>BYOB Sports - Open Event</title>
  <meta charset="utf-8" />

  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('eventId');

    // Build deep link
    window.deepLink = eventId
      ? `byobsports://events/${eventId}`
      : `byobsports://events`;

    // Try to open app immediately
    window.location.href = window.deepLink;
  </script>
</head>

<body>
  <div style="text-align: center; padding-top: 100px; font-family: Arial, sans-serif;">
    <h1>Opening BYOB Sports…</h1>
    <p>
      If nothing happens,
      <a id="deeplink" href="#">tap here to open the app</a>.
    </p>
  </div>

  <script>
    document.getElementById('deeplink').href = window.deepLink;
  </script>
</body>
</html>
